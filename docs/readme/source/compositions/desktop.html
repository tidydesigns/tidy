<!doctype html>
<html>
  <body>
    <template
      ><style>
        @font-face {
          font-family: "Instrument Serif";
          src: url("assets/InstrumentSerif-Regular.woff2");
        }
        #root {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          overflow: hidden;
        }
        .atmosphere {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          object-fit: cover;
          object-position: center;
          opacity: 0.14;
        }
        .cloud {
          position: absolute;
          width: 300px;
          height: 390px;
          object-fit: cover;
        }
        .coral {
          left: -100px;
          top: 70px;
          clip-path: polygon(0 0, 68% 0, 68% 24%, 100% 24%, 100% 76%, 68% 76%, 68% 100%, 0 100%);
        }
        .spectrum {
          right: -100px;
          bottom: 30px;
          clip-path: polygon(0 0, 100% 0, 100% 100%, 32% 100%, 32% 82%, 0 82%);
        }
        .wordmark {
          position: absolute;
          left: 210px;
          top: 28px;
          font-family: "Instrument Serif", serif;
          font-size: 64px;
          letter-spacing: -2px;
        }
        .tagline {
          position: absolute;
          right: 210px;
          top: 53px;
          font-size: 28px;
          color: #646464;
        }
        .beat {
          position: absolute;
          left: 210px;
          top: 106px;
          font-size: 36px;
          letter-spacing: -1px;
        }
        .recording {
          position: absolute;
          left: 210px;
          top: 178px;
          width: 1500px;
          height: 854px;
          object-fit: cover;
          border: 1px solid #dedede;
          border-radius: 14px;
          box-shadow: 0 14px 45px #00000016;
        }
      </style>
      <div id="root" data-composition-id="desktop" data-width="1920" data-height="1080">
        <img class="atmosphere" src="assets/cloud-atmosphere.webp" alt="" />
        <img
          class="cloud coral"
          data-layout-allow-overflow
          src="assets/cloud-coral.webp"
          alt=""
        /><img
          class="cloud spectrum"
          data-layout-allow-overflow
          src="assets/cloud-spectrum.webp"
          alt=""
        />
        <div class="wordmark">Tidy</div>
        <div class="tagline" data-var-text="headline">Design and build in the same place</div>
        <div
          id="desktop-beat-one"
          class="clip beat"
          data-start="0"
          data-duration="2.4"
          data-track-index="1"
        >
          <div>Keep the design in the conversation.</div>
        </div>
        <div
          id="desktop-beat-two"
          class="clip beat"
          data-start="2.4"
          data-duration="6.1"
          data-track-index="1"
        >
          <div>Shape the details on the canvas.</div>
        </div>
        <div
          id="desktop-beat-three"
          class="clip beat"
          data-start="8.5"
          data-duration="3.5"
          data-track-index="1"
        >
          <div>Return to the thread, with context.</div>
        </div>
        <video
          id="desktop-recording"
          class="clip recording"
          src="assets/desktop-interaction.mp4"
          muted
          data-start="0"
          data-duration="12"
          data-track-index="2"
          data-track-kind="video"
        ></video>
      </div>
      <script>
        const tl = gsap.timeline({ paused: true });
        tl.fromTo(
          "#desktop-beat-two > div",
          { y: 12, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.3, ease: "power2.out" },
          2.4,
        );
        tl.fromTo(
          "#desktop-beat-three > div",
          { y: 12, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.3, ease: "power2.out" },
          8.5,
        );
        window.__timelines.desktop = tl;
      </script></template
    >
  </body>
</html>
