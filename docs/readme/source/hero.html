<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Tidy desktop workspace</title>
    <style>
      @font-face {
        font-family: "Instrument Sans";
        src: url("assets/instrument-sans-latin.woff2");
        font-weight: 400 700;
      }
      @font-face {
        font-family: "Instrument Serif";
        src: url("assets/InstrumentSerif-Regular.woff2");
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #fafafa;
        color: #424242;
        font-family: "Instrument Sans", sans-serif;
      }
      .hero {
        position: relative;
        width: 1600px;
        height: 1240px;
        overflow: hidden;
        text-align: center;
      }
      .wordmark {
        position: relative;
        margin: 39px 0 24px;
        font-family: "Instrument Serif", serif;
        font-size: 67px;
        letter-spacing: -3px;
        line-height: 1;
      }
      h1 {
        position: relative;
        margin: 0;
        font-size: 88px;
        font-weight: 400;
        letter-spacing: -4.9px;
        line-height: 1.04;
      }
      .atmosphere {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
        opacity: 0.14;
      }
      .cloud {
        position: absolute;
        width: 300px;
        height: 340px;
        object-fit: cover;
      }
      .coral {
        left: -72px;
        top: 30px;
        clip-path: polygon(0 0, 68% 0, 68% 24%, 100% 24%, 100% 76%, 68% 76%, 68% 100%, 0 100%);
      }
      .spectrum {
        right: -76px;
        top: 60px;
        clip-path: polygon(0 0, 100% 0, 100% 100%, 32% 100%, 32% 82%, 0 82%);
      }
      .app {
        position: absolute;
        left: 72px;
        top: 360px;
        width: 1456px;
        overflow: hidden;
        background: #fafafa;
        border: 1px solid #dedede;
        border-radius: 15px;
        box-shadow: 0 16px 64px #00000017;
      }
      .window-controls {
        position: absolute;
        top: 14px;
        left: 18px;
        display: flex;
        gap: 9px;
      }
      .window-control {
        width: 13px;
        height: 13px;
        border: 1px solid rgb(0 0 0 / 0.1);
        border-radius: 50%;
      }
      .close {
        background: #ff5f57;
      }
      .minimise {
        background: #febc2e;
      }
      .maximise {
        background: #28c840;
      }
      .app img {
        display: block;
        width: 100%;
        height: auto;
      }
    </style>
  </head>
  <body>
    <main class="hero">
      <img class="atmosphere" src="assets/cloud-atmosphere.webp" alt="" />
      <img class="cloud coral" src="assets/cloud-coral.webp" alt="" /><img
        class="cloud spectrum"
        src="assets/cloud-spectrum.webp"
        alt=""
      />
      <div class="wordmark">Tidy</div>
      <h1>Design and build<br />in the same place</h1>
      <div class="app">
        <div class="window-controls" aria-hidden="true">
          <span class="window-control close"></span>
          <span class="window-control minimise"></span>
          <span class="window-control maximise"></span>
        </div>
        <img
          src="assets/desktop-thread.png"
          alt="Tidy desktop workspace with coding threads, agent controls and a floating design preview"
        />
      </div>
    </main>
  </body>
</html>
