name: Desktop beta release

on:
  push:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - "packages/**"
      - "licenses/bundled/**"
      - "LICENSE"
      - "THIRD_PARTY_NOTICES.md"
      - "scripts/bundle-licenses.ts"
      - "scripts/dependency-audit.mjs"
      - "scripts/desktop-release*.mjs"
      - "scripts/export-source.mjs"
      - "scripts/public-source.mjs"
      - "bun.lock"
      - "package.json"
      - "turbo.json"
      - ".github/workflows/desktop-release.yml"
  workflow_dispatch:

permissions:
  contents: read

# Queue releases rather than interrupting uploads or replacing pending merges.
concurrency:
  group: desktop-beta-release
  cancel-in-progress: false
  queue: max

env:
  DESKTOP_BETA_VERSION_OFFSET: ${{ vars.DESKTOP_BETA_VERSION_OFFSET || '1' }}

jobs:
  verify:
    name: Verify source and security
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run audit:dependencies
      - name: Export and scan committed source
        shell: bash
        run: |
          set -euo pipefail
          bun run export:source "$RUNNER_TEMP/tidy-desktop-source"
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks dir --redact --no-banner "$RUNNER_TEMP/tidy-desktop-source"
      - run: bun typecheck
      - run: bun lint
      - run: bun test
      - run: node --test scripts/desktop-release.test.mjs
      - name: Explain release setup
        if: vars.DESKTOP_BETA_RELEASES_ENABLED != 'true'
        run: echo 'Checks passed. Configure the desktop-beta environment and enable DESKTOP_BETA_RELEASES_ENABLED to publish betas.'

  build:
    name: Build signed macOS beta
    needs: verify
    if: github.ref == 'refs/heads/main' && vars.DESKTOP_BETA_RELEASES_ENABLED == 'true'
    environment: desktop-beta
    runs-on: macos-15
    timeout-minutes: 60
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    env:
      TIDY_MAC_SIGN_IDENTITY: ${{ vars.DESKTOP_MAC_SIGN_IDENTITY }}
      TIDY_NOTARY_PROFILE: tidy-ci-notarization
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Require an Apple Silicon builder
        run: node --input-type=module -e 'if (process.platform !== "darwin" || process.arch !== "arm64") throw new Error("Expected an Apple Silicon macOS runner")'
      - name: Stamp beta version into the build checkout
        run: node scripts/desktop-release.mjs prepare
      - run: bun run build:desktop
      - run: bun run --cwd apps/desktop test:security
      - name: Import signing and notarization credentials
        shell: bash
        env:
          TIDY_MAC_SIGN_KEYCHAIN: ${{ runner.temp }}/tidy-desktop-signing.keychain-db
          CERTIFICATE_P12: ${{ secrets.DESKTOP_MAC_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DESKTOP_MAC_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.DESKTOP_APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.DESKTOP_APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.DESKTOP_APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          for required in CERTIFICATE_P12 CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID TIDY_MAC_SIGN_IDENTITY; do
            if [[ -z "${!required}" ]]; then
              echo "Missing desktop-beta setting: $required" >&2
              exit 1
            fi
          done
          umask 077
          certificate_path="$RUNNER_TEMP/tidy-desktop-signing.p12"
          trap 'rm -f "$certificate_path"' EXIT
          printf '%s' "$CERTIFICATE_P12" | base64 --decode > "$certificate_path"
          keychain_password="$(openssl rand -base64 32)"
          printf '::add-mask::%s\n' "$keychain_password"
          security create-keychain -p "$keychain_password" "$TIDY_MAC_SIGN_KEYCHAIN"
          security set-keychain-settings -lut 21600 "$TIDY_MAC_SIGN_KEYCHAIN"
          security unlock-keychain -p "$keychain_password" "$TIDY_MAC_SIGN_KEYCHAIN"
          security import "$certificate_path" -P "$CERTIFICATE_PASSWORD" -t cert -f pkcs12 -T /usr/bin/codesign -k "$TIDY_MAC_SIGN_KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$TIDY_MAC_SIGN_KEYCHAIN" > /dev/null
          xcrun notarytool store-credentials "$TIDY_NOTARY_PROFILE" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_PASSWORD" --keychain "$TIDY_MAC_SIGN_KEYCHAIN"
      - name: Sign, notarize, staple and verify the installer
        env:
          TIDY_MAC_SIGN_KEYCHAIN: ${{ runner.temp }}/tidy-desktop-signing.keychain-db
        run: bun apps/desktop/scripts/release-mac.ts
      - name: Remove signing credentials
        if: always()
        shell: bash
        env:
          TIDY_MAC_SIGN_KEYCHAIN: ${{ runner.temp }}/tidy-desktop-signing.keychain-db
        run: |
          set -euo pipefail
          rm -f "$RUNNER_TEMP/tidy-desktop-signing.p12"
          if [[ -f "$TIDY_MAC_SIGN_KEYCHAIN" ]]; then
            security delete-keychain "$TIDY_MAC_SIGN_KEYCHAIN"
          fi
      - name: Write public release metadata
        run: node scripts/desktop-release.mjs metadata
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          name: desktop-beta-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.dmg.sha256
            apps/desktop/release/desktop-release.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: Publish verified beta
    needs: build
    if: github.ref == 'refs/heads/main' && vars.DESKTOP_BETA_RELEASES_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # Create desktop prereleases and upload their verified assets.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: ${{ runner.temp }}/desktop-beta-artifacts
          merge-multiple: true
      - name: Validate artifacts and publish the complete beta
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/desktop-release.mjs publish "$RUNNER_TEMP/desktop-beta-artifacts"
