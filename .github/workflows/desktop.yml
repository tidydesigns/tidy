name: Desktop security
on:
  pull_request:
    paths:
      - "apps/desktop/**"
      - "packages/**"
      - "scripts/bundle-licenses.ts"
      - "bun.lock"
      - "package.json"
      - ".github/workflows/desktop.yml"
permissions:
  contents: read
concurrency:
  group: desktop-security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - if: runner.os == 'Linux'
        name: Install virtual display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb libgtk-3-0t64 libnss3 libasound2t64 libgbm1
      - run: bun run build:desktop
      - if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum bun run --cwd apps/desktop test:security
      - if: runner.os == 'macOS'
        run: bun run --cwd apps/desktop test:security
      - run: bun run package:desktop
